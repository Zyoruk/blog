# Amplify reads this file from the repo root and applies these headers to the
# deployed site. This is the ONLY place production headers come from — the
# `server.headers` block in astro.config.mjs applies to `astro dev` only.
# Keep the two in sync when changing policy.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'geolocation=(), microphone=(), camera=()'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

  # Content-hashed build output is immutable.
  - pattern: '/_astro/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  - pattern: '/fonts/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  # The service worker must never be served stale, or clients can never be
  # updated off a broken one.
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
